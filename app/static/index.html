<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map Asset Prep — Fusion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#15171c; --panel:#1d2027; --line:#2c313b; --txt:#e8eaee; --dim:#9aa1ad; --acc:#4cc2ff; --ok:#43d17c; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font:13px/1.45 -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--txt); }
  #app { display:flex; height:100%; position:relative; }
  #side { width:340px; min-width:340px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  #side h1 { font-size:14px; margin:0; padding:14px 16px 10px; letter-spacing:.4px; }
  #side h1 span { color:var(--acc); }
  .sec { padding:0 16px 12px; border-bottom:1px solid var(--line); }
  .sec label { display:block; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin:10px 0 4px; }
  input[type=text], input[type=number], select {
    width:100%; background:#12141a; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px; font-size:13px; outline:none;
  }
  input:focus, select:focus { border-color:var(--acc); }
  #clist { height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-top:4px; background:#12141a; }
  .crow { padding:5px 9px; cursor:pointer; display:flex; justify-content:space-between; }
  .crow:hover { background:#232833; }
  .crow.pend { background:#243043; }
  .crow.sel { color:var(--acc); }
  .crow .iso { color:var(--dim); font-size:11px; }
  #hbtn { width:100%; margin-top:8px; padding:8px; border:1px solid var(--acc); background:transparent; color:var(--acc); border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; }
  #hbtn:disabled { border-color:#3a4149; color:#7b828c; cursor:default; }
  #countrycolor { width:100%; height:34px; padding:3px; background:#12141a; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  #countrycolor:disabled { opacity:.45; cursor:default; }
  #chips { margin-top:6px; display:flex; flex-wrap:wrap; gap:5px; }
  .chip { background:#0e2a3a; border:1px solid #1c4a63; color:var(--acc); border-radius:20px; padding:2px 10px; font-size:12px; cursor:pointer; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; }
  #mapwrap { flex:1; position:relative; min-width:0; overflow:hidden; }
  #map { width:100%; height:100%; }
  /* The export target sits over the live map. It never intercepts map input:
     pan and zoom the imagery underneath until the shot looks correct inside it. */
  #targetframe { position:absolute; z-index:600; pointer-events:none; border:4px solid #ff3b30;
    border-radius:2px; box-shadow:0 0 0 9999px rgba(0,0,0,.52), 0 0 12px rgba(0,0,0,.8); }
  #targetlabel { position:absolute; top:-25px; left:-4px; padding:3px 8px; border-radius:3px 3px 0 0;
    background:#ff3b30; color:#fff; font-size:11px; font-weight:700; letter-spacing:.3px; white-space:nowrap; }
  /* Center guide for balancing a country or focal point within the export. */
  #targetvertical { position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);
    background:rgba(255,59,48,.9); box-shadow:0 0 3px rgba(0,0,0,.9); }
  #frameinfo { color:var(--dim); font-size:11px; margin-top:6px; }
  #exportbtn {
    width:calc(100% - 32px); margin:12px 16px; padding:11px; border:0; border-radius:8px;
    background:var(--acc); color:#04202e; font-weight:700; font-size:14px; cursor:pointer;
  }
  #exportbtn:disabled { background:#3a4149; color:#7b828c; cursor:default; }
  #librarybtn { width:calc(100% - 32px); margin:0 16px 10px; padding:8px; border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--txt); cursor:pointer; }
  #librarybtn:hover { border-color:var(--acc); color:var(--acc); }
  #progress { margin:0 16px 8px; }
  #pbar { height:8px; background:#12141a; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  #pfill { height:100%; width:0%; background:var(--acc); transition:width .3s; }
  #pmsg { color:var(--dim); font-size:11px; margin-top:4px; min-height:14px; }
  #result { position:absolute; left:352px; bottom:12px; width:min(560px, calc(100% - 372px)); max-height:75%; overflow-y:auto;
    background:rgba(24,27,33,.97); border:1px solid var(--line); border-radius:10px; padding:14px;
    box-shadow:0 10px 34px rgba(0,0,0,.55); z-index:1200; display:none; font-size:12px; }
  #result .close { float:right; cursor:pointer; color:var(--dim); font-size:15px; margin-left:8px; user-select:none; }
  #result .close:hover { color:var(--txt); }
  #result img { width:100%; border-radius:6px; border:1px solid var(--line); margin-top:6px; display:block; }
  #result .ok { color:var(--ok); } #result .err { color:var(--err); white-space:pre-wrap; }
  #result code { color:var(--dim); word-break:break-all; }
  .exportrow { border-top:1px solid var(--line); padding:9px 0; }
  .exportrow:first-child { border-top:0; padding-top:0; }
  .exportrow .exportname { font-weight:600; }
  .exportrow .exportmeta { color:var(--dim); font-size:11px; margin:2px 0 6px; }
  .smallbtn { display:inline-block; padding:5px 8px; border:1px solid var(--line); border-radius:5px; color:var(--txt); text-decoration:none; background:#20252e; font-size:11px; cursor:pointer; margin-right:5px; }
  .smallbtn:hover { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Map Asset Prep <span>· Fusion</span></h1>

    <div class="sec">
      <label>Countries</label>
      <input type="text" id="search" placeholder="filter… (e.g. Saudi)">
      <div id="clist"></div>
      <button id="hbtn" disabled>Select a country in the list</button>
      <div id="chips"></div>
      <label>Highlighted country color</label>
      <input type="color" id="countrycolor" value="#1689ff" disabled>
      <div id="colorhint" style="color:var(--dim);font-size:11px;margin-top:4px">Select a highlighted country to edit its export color.</div>
    </div>

    <div class="sec">
      <div class="row2">
        <div>
          <label>Orientation</label>
          <select id="orient">
            <option value="landscape">Landscape</option>
            <option value="vertical">Vertical</option>
          </select>
        </div>
        <div>
          <label>Resolution</label>
          <select id="res">
            <option value="4k">4K UHD</option>
            <option value="fhd">Full HD</option>
            <option value="hd">HD</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div>
          <label>Imagery</label>
          <select id="source">
            <option value="google_satellite">Google Satellite</option>
            <option value="esri_world_imagery">Esri World Imagery</option>
          </select>
        </div>
        <div>
          <label>Wide factor</label>
          <input type="number" id="widefactor" value="2" min="1.2" max="4" step="0.5">
        </div>
      </div>
      <div>
        <label>Export name</label>
        <input type="text" id="shotname" value="saudi_arabia">
      </div>
      <div id="frameinfo"></div>
    </div>

    <button id="exportbtn" disabled>Select a country first</button>
    <button id="librarybtn">Open export library</button>
    <div id="progress">
      <div id="pbar"><div id="pfill"></div></div>
      <div id="pmsg"></div>
    </div>
    <div style="flex:1"></div>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="targetframe"><span id="targetlabel">EXPORT TARGET</span><span id="targetvertical"></span></div>
  </div>
  <div id="result"><span class="close" id="rclose" title="close">✕</span><div id="resultbody"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const R = 6378137, MERC_MAX = 20037508.342789244;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function llToMerc(lng, lat) {
  lat = Math.max(-85.05112878, Math.min(85.05112878, lat));
  return [R * rad(lng), R * Math.log(Math.tan(Math.PI / 4 + rad(lat) / 2))];
}
function mercToLL(x, y) { return [deg(x / R), deg(2 * Math.atan(Math.exp(y / R)) - Math.PI / 2)]; }

// ---- map ----
const layers = {
  google_satellite: L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
    { subdomains: ["0","1","2","3"], maxZoom: 20, attribution: "Imagery © Google" }),
  esri_world_imagery: L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Esri, Maxar" }),
};
const map = L.map("map", {
  zoomControl: true,
  // Make +/− controls and wheel zoom movement more gradual for precise framing.
  zoomDelta: 0.25,
  zoomSnap: 0.05,
  wheelPxPerZoomLevel: 120,
}).setView([24.0, 45.0], 6);
layers.google_satellite.addTo(map);

// ---- state ----
let allCountries = [];
let pending = null;               // iso3 highlighted in the list (not yet on map)
let selected = new Map();         // iso3 -> {iso3, name}  (highlighted countries)
const outlineLayers = {};         // iso3 -> Leaflet outline layer on the map
let targetCrop = null;            // visible export crop in Leaflet container pixels
let exporting = false;
const DEFAULT_COUNTRY_COLOR = "#1689ff";

// ---- country list ----
const clist = document.getElementById("clist");
const search = document.getElementById("search");
const hbtn = document.getElementById("hbtn");
const colorInput = document.getElementById("countrycolor");
const colorHint = document.getElementById("colorhint");
search.addEventListener("input", renderList);
hbtn.addEventListener("click", highlightAction);
colorInput.addEventListener("input", () => {
  const c = pending && selected.get(pending);
  if (!c) return;
  c.color = colorInput.value;
  if (outlineLayers[c.iso3]) outlineLayers[c.iso3].setStyle({ color: c.color });
  renderChips();
});

async function boot() {
  const r = await fetch("/api/countries");
  const data = await r.json();
  if (data.error) { clist.textContent = data.error; return; }
  allCountries = data.countries;
  renderList();
  // convenience: Saudi Arabia highlighted by default for the first test
  const sau = allCountries.find(c => c.iso3 === "SAU");
  if (sau) {
    addCountry(sau);
    // Make the default highlight immediately editable; the user should not
    // need to click Saudi Arabia a second time just to change its color.
    pending = sau.iso3;
    renderList(); updateHbtn();
  }
}

function renderList() {
  const q = search.value.trim().toLowerCase();
  clist.textContent = "";
  for (const c of allCountries) {
    if (q && !c.name.toLowerCase().includes(q) && !c.iso3.toLowerCase().includes(q)) continue;
    const row = document.createElement("div");
    row.className = "crow"
      + (pending === c.iso3 ? " pend" : "")
      + (selected.has(c.iso3) ? " sel" : "");
    row.innerHTML = `<span>${c.name}${selected.has(c.iso3) ? " ●" : ""}</span><span class="iso">${c.iso2}</span>`;
    row.onclick = () => { pending = (pending === c.iso3 ? null : c.iso3); renderList(); updateHbtn(); };
    clist.appendChild(row);
  }
}

async function drawOutline(c) {
  if (outlineLayers[c.iso3]) return;
  const r = await fetch("/api/country/" + c.iso3);
  const d = await r.json();
  if (d.geometry && selected.has(c.iso3) && !outlineLayers[c.iso3]) {
    outlineLayers[c.iso3] = L.geoJSON(d.geometry, {
      style: { color: c.color, weight: 3.5, fill: false, interactive: false },
    }).addTo(map);
  }
}

function addCountry(c) {
  const highlighted = { ...c, color: DEFAULT_COUNTRY_COLOR };
  selected.set(c.iso3, highlighted);
  // The latest highlighted country becomes the active color target.
  pending = c.iso3;
  drawOutline(highlighted);
  renderChips(); renderList(); updateHbtn(); updateButton();
}

function removeCountry(iso) {
  selected.delete(iso);
  if (outlineLayers[iso]) { map.removeLayer(outlineLayers[iso]); delete outlineLayers[iso]; }
  renderChips(); renderList(); updateHbtn(); updateButton();
}

async function highlightAction() {
  if (!pending) return;
  const c = allCountries.find(x => x.iso3 === pending);
  if (!c) return;
  if (selected.has(pending)) removeCountry(pending);
  else addCountry(c);
}

function updateHbtn() {
  if (!pending) { hbtn.disabled = true; hbtn.textContent = "Select a country in the list"; updateColorPicker(); return; }
  const c = allCountries.find(x => x.iso3 === pending);
  hbtn.disabled = false;
  hbtn.textContent = selected.has(pending) ? `Remove ${c.name} highlight` : `Highlight ${c.name}`;
  updateColorPicker();
}

function updateColorPicker() {
  const c = pending && selected.get(pending);
  colorInput.disabled = !c;
  colorInput.value = c ? c.color : DEFAULT_COUNTRY_COLOR;
  colorHint.textContent = c
    ? `${c.name}: ${c.color} — used in the exported PNG and SVG.`
    : "Select a highlighted country to edit its export color.";
}

function renderChips() {
  const chips = document.getElementById("chips");
  chips.textContent = "";
  for (const [iso, c] of selected) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = c.name + " ✕";
    chip.style.borderColor = c.color;
    chip.style.color = c.color;
    chip.title = "remove highlight";
    chip.onclick = () => removeCountry(iso);
    chips.appendChild(chip);
  }
}
function updateButton() {
  const b = document.getElementById("exportbtn");
  const ok = selected.size > 0 && !exporting;
  b.disabled = !ok;
  b.textContent = exporting ? "Exporting…" : `Export assets (${selected.size} country${selected.size > 1 ? "s" : ""})`;
}

// ---- previous exports / re-edit -----------------------------------------
async function showLibrary() {
  const body = document.getElementById("resultbody");
  showResult(`<div><b>Export library</b><div class="exportmeta">Choose a previous package to animate or restore into the asset-preparation map.</div><div id="librarylist">Loading…</div></div>`);
  const r = await fetch("/api/exports"), data = await r.json();
  if (data.error) { document.getElementById("librarylist").textContent = data.error; return; }
  const list = document.getElementById("librarylist"); list.textContent = "";
  if (!data.exports.length) { list.textContent = "No export packages found."; return; }
  for (const item of data.exports) {
    const row = document.createElement("div"); row.className = "exportrow";
    const name = document.createElement("div"); name.className = "exportname"; name.textContent = item.name;
    const info = document.createElement("div"); info.className = "exportmeta";
    const out = item.output || {};
    info.textContent = `${out.width || "?"}×${out.height || "?"} · ${(item.countries || []).join(", ") || "no countries"}${item.has_animation ? " · animation saved" : ""}`;
    const edit = document.createElement("button"); edit.className = "smallbtn"; edit.textContent = "Re-edit assets";
    edit.onclick = () => restoreExport(item.name);
    const animate = document.createElement("a"); animate.className = "smallbtn"; animate.textContent = "Animate";
    animate.href = `/static/animation.html?export=${encodeURIComponent(item.name)}`;
    row.append(name, info, edit, animate); list.appendChild(row);
  }
}

async function restoreExport(name) {
  try {
    const r = await fetch(`/api/animation/${encodeURIComponent(name)}`), data = await r.json();
    if (data.error) throw new Error(data.error);
    const meta = data.metadata, output = meta.output || {};
    // Remove only current UI/map selection; old package files remain untouched.
    for (const iso of [...selected.keys()]) removeCountry(iso);
    document.getElementById("orient").value = output.orientation || "landscape";
    document.getElementById("res").value = output.resolution || "4k";
    document.getElementById("widefactor").value = output.wide_factor || 2;
    document.getElementById("source").value = (meta.imagery || {}).source || "google_satellite";
    document.getElementById("source").dispatchEvent(new Event("change"));
    // Keep the base name. The exporter automatically appends a timestamp if it
    // already exists, preserving the original package as a reproducible version.
    document.getElementById("shotname").value = name.replace(/_\d{8}-\d{6}$/, "");
    for (const mask of meta.countries || []) {
      const country = allCountries.find(c => c.iso3 === mask.iso3);
      if (!country) continue;
      const restored = { ...country, color: mask.color || DEFAULT_COUNTRY_COLOR };
      selected.set(restored.iso3, restored);
      drawOutline(restored);
    }
    pending = meta.countries && meta.countries[0] ? meta.countries[0].iso3 : null;
    renderChips(); renderList(); updateHbtn(); updateButton(); updateFrame();
    const b = meta.detail && meta.detail.bbox_mercator;
    if (b && targetCrop) {
      const [west, north] = mercToLL(b.minx, b.maxy);
      const [east, south] = mercToLL(b.maxx, b.miny);
      const size = map.getSize();
      const padding = L.point((size.x - targetCrop.width) / 2, (size.y - targetCrop.height) / 2);
      map.fitBounds([[south, west], [north, east]], { paddingTopLeft: padding, paddingBottomRight: padding, animate: false });
    }
    document.getElementById("result").style.display = "none";
    document.getElementById("pmsg").textContent = `Restored ${name}. Exporting changes creates a new dated version.`;
  } catch (err) {
    showResult(`<div class="err">Could not restore export: ${err.message}</div>`);
  }
}
document.getElementById("librarybtn").addEventListener("click", showLibrary);

// ---- visible export target ----
function updateFrame() {
  const [W, H] = getDims();
  const size = map.getSize();
  if (!size.x || !size.y) return;
  const padding = 48, aspect = W / H;
  const availableW = Math.max(1, size.x - padding * 2);
  const availableH = Math.max(1, size.y - padding * 2);
  let width, height;
  if (availableW / availableH > aspect) {
    height = availableH; width = height * aspect;
  } else {
    width = availableW; height = width / aspect;
  }
  const x = (size.x - width) / 2, y = (size.y - height) / 2;
  targetCrop = { x, y, width, height };
  const target = document.getElementById("targetframe");
  // The red border is visual only; export coordinates use the interior.
  target.style.left = `${x - 4}px`;
  target.style.top = `${y - 4}px`;
  target.style.width = `${width + 8}px`;
  target.style.height = `${height + 8}px`;
  document.getElementById("frameinfo").textContent =
    `Red target = exported image · ${W}×${H} px · pan and zoom the map underneath it`;
}
const DIMS = {
  "4k":  { landscape: [3840, 2160], vertical: [2160, 3840] },
  "fhd": { landscape: [1920, 1080], vertical: [1080, 1920] },
  "hd":  { landscape: [1280, 720],  vertical: [720, 1280] },
};
const getDims = () => DIMS[document.getElementById("res").value][document.getElementById("orient").value];
map.on("move zoomend", updateFrame);
map.on("resize", updateFrame);
document.getElementById("orient").addEventListener("change", updateFrame);
document.getElementById("res").addEventListener("change", updateFrame);

// source switch
document.getElementById("source").addEventListener("change", (e) => {
  for (const k in layers) map.removeLayer(layers[k]);
  layers[e.target.value].addTo(map);
});

// ---- export ----
document.getElementById("exportbtn").addEventListener("click", async () => {
  if (exporting || selected.size === 0) return;
  exporting = true; updateButton();
  document.getElementById("result").style.display = "none";
  const tl = map.containerPointToLatLng([targetCrop.x, targetCrop.y]);
  const br = map.containerPointToLatLng([targetCrop.x + targetCrop.width, targetCrop.y + targetCrop.height]);
  const [minx, maxy] = llToMerc(tl.lng, tl.lat);
  const [maxx, miny] = llToMerc(br.lng, br.lat);
  const body = {
    name: document.getElementById("shotname").value.trim() || "shot",
    countries: [...selected.keys()],
    country_colors: Object.fromEntries([...selected].map(([iso, country]) => [iso, country.color])),
    center: map.getCenter(),
    zoom: map.getZoom(),
    detail_bbox_mercator: { minx, miny, maxx, maxy },
    orientation: document.getElementById("orient").value,
    resolution: document.getElementById("res").value,
    wide_factor: parseFloat(document.getElementById("widefactor").value) || 2,
    source: document.getElementById("source").value,
  };
  const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json();
  if (d.error) { showResult(`<div class="err">Export failed to start: ${d.error}</div>`); exporting = false; updateButton(); return; }
  poll(d.job_id);
});

async function poll(id) {
  const pmsg = document.getElementById("pmsg"), pfill = document.getElementById("pfill");
  while (true) {
    const r = await fetch("/api/export/status/" + id);
    const d = await r.json();
    const s = d.status || {};
    pfill.style.width = (s.pct || 0) + "%";
    pmsg.textContent = `[${s.stage}] ${s.message || ""}`;
    if (s.stage === "done") { showResultHtml(d.result); break; }
    if (s.stage === "error") {
      showResult(`<div class="err">Export failed:\n${s.message}</div>`);
      break;
    }
    await new Promise(res => setTimeout(res, 800));
  }
  exporting = false; updateButton();
}

function showResult(html) {
  document.getElementById("resultbody").innerHTML = html;
  document.getElementById("result").style.display = "block";
}
function showResultHtml(result) {
  const dir = result.output_dir.split("/").slice(-1)[0];
  const files = result.files.map(f => `<code>${f}</code>`).join("<br>");
  showResult(`
     <div class="ok">✔ Export complete in ${result.elapsed_sec}s — <code>app/exports/${dir}/</code></div>
     <div style="margin-top:4px">${files}</div>
     <div style="margin-top:10px"><a href="/static/animation.html?export=${encodeURIComponent(dir)}" style="display:inline-block;padding:7px 10px;border-radius:6px;background:#4cc2ff;color:#04202e;text-decoration:none;font-weight:700">Animate this export →</a></div>
     <div style="margin-top:6px">Red overlay = mask alignment on the detail background:</div>
    <img src="/exports/${dir}/alignment_check.jpg">`);
}

document.getElementById("rclose").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
});

boot(); updateFrame();
</script>
</body>
</html>
