<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Animation Editor — Fusion</title>
<style>
:root{--bg:#15171c;--panel:#1d2027;--line:#343a46;--txt:#e8eaee;--dim:#a0a7b3;--acc:#4cc2ff;--ok:#43d17c;--err:#ff6b6b}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}#app{height:100%;display:flex}#side{width:320px;min-width:320px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}h1{font-size:15px;margin:0 0 12px}h1 span{color:var(--acc)}h2{font-size:11px;color:var(--dim);letter-spacing:.7px;text-transform:uppercase;margin:16px 0 6px}.back{color:var(--acc);text-decoration:none}.field{margin:7px 0}.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}input,select,button{font:inherit}input,select{width:100%;color:var(--txt);background:#11141a;border:1px solid var(--line);border-radius:5px;padding:7px}button{border:1px solid var(--line);border-radius:6px;padding:8px;background:#252a34;color:var(--txt);cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--acc);border-color:var(--acc);color:#07202e;font-weight:700}.danger{color:var(--err)}.row{display:flex;gap:7px}.row>*{flex:1}.note{color:var(--dim);font-size:11px;margin-top:6px}.status{min-height:18px;margin-top:10px;color:var(--dim)}.status.ok{color:var(--ok)}.status.err{color:var(--err)}#main{min-width:0;flex:1;display:flex;flex-direction:column;padding:18px;gap:10px}#title{font-weight:600}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.preview-wrap{min-height:0;flex:1;background:#08090c;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{display:block;max-width:100%;max-height:100%;touch-action:none;cursor:grab;background:#090a0c}.dragging{cursor:grabbing}#timeline{height:105px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;position:relative}.controls{display:flex;align-items:center;gap:8px}.controls button{padding:6px 10px}.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:130px}.track{height:38px;position:relative;margin-top:8px;border-top:1px solid #4a5160;cursor:pointer}.playhead{position:absolute;top:-7px;bottom:-5px;border-left:2px solid #fff;pointer-events:none}.key{position:absolute;top:-6px;width:13px;height:13px;background:var(--acc);border:1px solid #d7f3ff;transform:translateX(-50%) rotate(45deg);cursor:pointer}.key.selected{background:#ff6b6b;border-color:white}.keylabel{position:absolute;top:13px;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap}.hidden{display:none!important}@media(max-width:820px){#app{display:block}#side{width:100%;min-width:0;height:42%;display:flex;flex-wrap:wrap;gap:0}#main{height:58%}.sec{width:50%;padding-right:12px}}
</style>
</head>
<body><div id="app">
<aside id="side">
<a class="back" href="/">← Asset preparation</a><h1>2D <span>Animation Editor</span></h1>
<div class="field"><label>Export package</label><select id="exports"></select></div>
<div id="shot" class="hidden">
<h2>Shot settings</h2>
<div class="field"><label>Shot name</label><input id="name" value="Map animation"></div>
<div class="row"><div class="field"><label>Duration (seconds)</label><input id="duration" type="number" min="1" max="1500" step=".1" value="7"></div><div class="field"><label>FPS</label><select id="fps"><option>24</option><option>25</option><option>30</option><option>60</option></select></div></div>
<div class="note" id="format"></div>
<h2>Current view / keyframe</h2>
<div class="row"><div class="field"><label>Time (seconds)</label><input id="time" type="number" min="0" step=".041667" value="0"></div><div class="field"><label>Zoom</label><input id="zoom" type="number" min="1" step=".01" value="1"></div></div>
<div class="field"><label>Movement into this keyframe</label><select id="easing"><option value="smooth">Smooth</option><option value="linear">Linear</option></select></div>
<div class="row"><button id="add" class="primary">Add keyframe</button><button id="update">Update</button><button id="remove" class="danger">Delete</button></div>
<div class="note">Drag the preview to pan. Scroll to zoom. The editor keeps the view inside the wide background.</div>
<div class="row" style="margin-top:12px"><button id="fit">Fit wide</button><button id="detail">Match detail</button></div>
<h2>Save / Fusion</h2><div class="row"><button id="save">Save animation</button><button id="fusion" class="primary">Generate Fusion</button></div>
<div class="status" id="status"></div></div>
</aside>
<main id="main"><div class="top"><div id="title">Choose an exported asset package</div><div id="coverage" class="note"></div></div><div class="preview-wrap"><canvas id="canvas"></canvas></div><section id="timeline" class="hidden"><div class="controls"><button id="play">▶ Play</button><span class="time" id="clock">00:00.00 / 00:00.00</span><button id="stepback">‹ Frame</button><button id="stepforward">Frame ›</button><button id="addtop">+ Add keyframe</button></div><div class="track" id="track"><div class="playhead" id="playhead"></div><div id="keys"></div></div></section></main>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), canvas=$("canvas"),ctx=canvas.getContext("2d");
let packageName=null,meta=null,animation=null,images={},view={x:.5,y:.5,z:1},frame=0,selectedFrame=null,playing=false,lastTick=0,drag=null;
const query=new URLSearchParams(location.search).get("export");
const url=path=>"/exports/"+encodeURIComponent(packageName)+"/"+path;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function status(message,kind=""){$("status").textContent=message;$("status").className="status "+kind}
function seconds(f){return f/Number($("fps").value)}
function formatTime(f){let s=seconds(f);return String(Math.floor(s/60)).padStart(2,"0")+":"+(s%60).toFixed(2).padStart(5,"0")}
function durationFrames(){return Math.max(1,Math.round(Number($("duration").value)*Number($("fps").value)))}
function wideFactor(){return Number(meta.output.wide_factor)}
function clampView(){view.z=clamp(view.z,1,wideFactor()*16);let d=.5/view.z;view.x=clamp(view.x,d,1-d);view.y=clamp(view.y,d,1-d)}
function setView(next){view={...view,...next};clampView();$("zoom").value=view.z.toFixed(3);draw()}
function defaultAnimation(){let fps=24,duration=168,detail=Math.min(wideFactor(),16);return {schema_version:1,name:"Map animation",assets_metadata:"metadata.json",output:{width:meta.output.width,height:meta.output.height,fps,duration_frames:duration},keyframes:[{frame:0,center:{x:.5,y:.5},zoom:1,easing:"linear"},{frame:Math.min(96,duration-1),center:{x:.5,y:.5},zoom:detail,easing:"smooth"}]}}
function ease(t,type){return type==="smooth"?t*t*(3-2*t):t}
function evaluate(at){let keys=animation.keyframes;if(at<=keys[0].frame)return {...keys[0].center,z:keys[0].zoom};for(let i=1;i<keys.length;i++){let b=keys[i],a=keys[i-1];if(at<=b.frame){let t=ease((at-a.frame)/(b.frame-a.frame),b.easing);return{x:a.center.x+(b.center.x-a.center.x)*t,y:a.center.y+(b.center.y-a.center.y)*t,z:a.zoom+(b.zoom-a.zoom)*t}}}return {...keys[keys.length-1].center,z:keys[keys.length-1].zoom}}
function loadImage(src){return new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("could not load "+src));i.src=src})}
async function loadPackage(name){packageName=name;status("Loading exported assets…");let r=await fetch("/api/animation/"+encodeURIComponent(name)),data=await r.json();if(data.error)throw Error(data.error);meta=data.metadata;animation=data.animation||defaultAnimation();$("name").value=animation.name;$("fps").value=animation.output.fps;$("duration").value=(animation.output.duration_frames/animation.output.fps).toFixed(3);$("format").textContent=`${meta.output.width}×${meta.output.height} · wide coverage ${wideFactor()}×`;$("title").textContent="Animating: "+name;images={wide:await loadImage(url("satellite_wide.png")),detail:await loadImage(url("satellite_detail.png"))};for(const c of meta.countries)images[c.iso3]=await loadImage(url(c.file));frame=0;selectedFrame=0;setView(evaluate(0));$("shot").classList.remove("hidden");$("timeline").classList.remove("hidden");status("Loaded. Compose a view, then add or update a keyframe.","ok");render()}
function draw(){if(!meta||!images.wide)return;let box=canvas.parentElement.getBoundingClientRect(),ratio=meta.output.width/meta.output.height,w=Math.max(1,Math.floor(Math.min(box.width,box.height*ratio))),h=Math.round(w/ratio);canvas.width=w;canvas.height=h;let factor=wideFactor(),sourceW=images.wide.width,sourceH=images.wide.height;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);ctx.scale(view.z,view.z);ctx.translate(-view.x*w,-view.y*h);ctx.drawImage(images.wide,0,0,w,h);let dx=w*(1-1/factor)/2,dy=h*(1-1/factor)/2,dw=w/factor,dh=h/factor;ctx.drawImage(images.detail,dx,dy,dw,dh);for(const country of meta.countries)ctx.drawImage(images[country.iso3],dx,dy,dw,dh);ctx.restore();$("coverage").textContent=`View ${view.z.toFixed(2)}× · wide background boundary enforced`}
function render(){if(!animation)return;let total=durationFrames();if(frame>=total)frame=total-1;$("time").max=((total-1)/Number($("fps").value)).toFixed(3);$("time").value=seconds(frame).toFixed(3);$("clock").textContent=formatTime(frame)+" / "+formatTime(total-1);$("playhead").style.left=(frame/Math.max(1,total-1)*100)+"%";let holder=$("keys");holder.textContent="";for(const key of animation.keyframes){let e=document.createElement("button");e.className="key"+(selectedFrame===key.frame?" selected":"");e.style.left=(key.frame/Math.max(1,total-1)*100)+"%";e.title=`${formatTime(key.frame)} · ${key.zoom.toFixed(2)}×`;e.onclick=event=>{event.stopPropagation();selectKey(key.frame)};holder.appendChild(e);let label=document.createElement("span");label.className="keylabel";label.style.left=e.style.left;label.textContent=(key.frame/Number($("fps").value)).toFixed(1)+"s";holder.appendChild(label)}draw()}
function selectKey(f){frame=f;selectedFrame=f;let key=animation.keyframes.find(k=>k.frame===f);setView({...key.center,z:key.zoom});$("easing").value=key.easing;render()}
function currentKey(){return {frame,center:{x:view.x,y:view.y},zoom:view.z,easing:$("easing").value}}
function upsert(){let key=currentKey(),old=animation.keyframes.findIndex(k=>k.frame===frame);if(old>=0)animation.keyframes[old]=key;else animation.keyframes.push(key);animation.keyframes.sort((a,b)=>a.frame-b.frame);selectedFrame=frame;status("Keyframe updated — save when ready.","ok");render()}
function deleteKey(){let i=animation.keyframes.findIndex(k=>k.frame===selectedFrame);if(i<0)return; if(animation.keyframes.length===1){status("A shot needs at least one keyframe.","err");return}animation.keyframes.splice(i,1);selectedFrame=null;status("Keyframe deleted — save when ready.","ok");render()}
function build(){return {...animation,name:$("name").value.trim()||"Map animation",output:{width:meta.output.width,height:meta.output.height,fps:Number($("fps").value),duration_frames:durationFrames()}}}
async function send(path){let body=build(),r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),data=await r.json();if(!r.ok||data.error)throw Error(data.error||"request failed");animation=data.animation||body;return data}
$("add").onclick=upsert;$("addtop").onclick=upsert;$("update").onclick=upsert;$("remove").onclick=deleteKey;$("fit").onclick=()=>{setView({x:.5,y:.5,z:1});selectedFrame=null};$("detail").onclick=()=>{setView({x:.5,y:.5,z:wideFactor()});selectedFrame=null};$("zoom").onchange=()=>setView({z:Number($("zoom").value)});$("time").onchange=()=>{frame=clamp(Math.round(Number($("time").value)*Number($("fps").value)),0,durationFrames()-1);selectedFrame=animation.keyframes.some(k=>k.frame===frame)?frame:null;setView(evaluate(frame));render()};$("duration").onchange=()=>{let total=durationFrames();if(animation.keyframes.some(k=>k.frame>=total)){status("Duration cannot end before an existing keyframe.","err");$("duration").value=(animation.output.duration_frames/animation.output.fps).toFixed(3);return}animation.output.duration_frames=total;render()};$("fps").onchange=()=>{animation.output.fps=Number($("fps").value);render()};
$("save").onclick=async()=>{try{let data=await send("/api/animation/"+encodeURIComponent(packageName));status("Animation saved as animation.json.","ok");animation=data.animation;render()}catch(e){status(e.message,"err")}};$("fusion").onclick=async()=>{try{let data=await send("/api/animation/"+encodeURIComponent(packageName)+"/fusion");status("Generated "+data.file+". Import it into Fusion to verify the 2D graph.","ok");animation=build()}catch(e){status(e.message,"err")}};
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,view:{...view}};canvas.setPointerCapture(e.pointerId);canvas.classList.add("dragging")});canvas.addEventListener("pointermove",e=>{if(!drag)return;setView({x:drag.view.x-(e.clientX-drag.x)/(canvas.width*drag.view.z),y:drag.view.y-(e.clientY-drag.y)/(canvas.height*drag.view.z)})});canvas.addEventListener("pointerup",()=>{drag=null;canvas.classList.remove("dragging")});canvas.addEventListener("wheel",e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,old=view.z,next=clamp(old*Math.exp(-e.deltaY*.0015),1,wideFactor()*16);setView({x:view.x+(px-.5)*(1/old-1/next),y:view.y+(py-.5)*(1/old-1/next),z:next})},{passive:false});
$("track").onclick=e=>{let r=$("track").getBoundingClientRect();frame=clamp(Math.round((e.clientX-r.left)/r.width*(durationFrames()-1)),0,durationFrames()-1);selectedFrame=animation.keyframes.some(k=>k.frame===frame)?frame:null;setView(evaluate(frame));render()};$("stepback").onclick=()=>{frame=Math.max(0,frame-1);setView(evaluate(frame));render()};$("stepforward").onclick=()=>{frame=Math.min(durationFrames()-1,frame+1);setView(evaluate(frame));render()};$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"❚❚ Pause":"▶ Play";lastTick=performance.now();requestAnimationFrame(tick)};function tick(now){if(!playing)return;let elapsed=now-lastTick;lastTick=now;frame+=elapsed/1000*Number($("fps").value);if(frame>=durationFrames()-1){frame=durationFrames()-1;playing=false;$("play").textContent="▶ Play"}selectedFrame=null;setView(evaluate(frame));render();if(playing)requestAnimationFrame(tick)}
window.addEventListener("resize",draw);async function boot(){try{let r=await fetch("/api/exports"),data=await r.json();for(const p of data.exports||[]){let o=document.createElement("option");o.value=p.name;o.textContent=`${p.name} — ${(p.countries||[]).join(", ")}`;$("exports").appendChild(o)}if(!data.exports?.length){status("No export packages yet. Return to Asset preparation and export a map package.","err");return}let chosen=data.exports.find(p=>p.name===query)?.name||data.exports[0].name;$("exports").value=chosen;await loadPackage(chosen);$("exports").onchange=()=>loadPackage($("exports").value)}catch(e){status(e.message,"err")}}boot();
</script></body></html>
