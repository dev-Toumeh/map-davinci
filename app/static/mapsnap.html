<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapSnap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#15171c; color:#e8eaee; }
  #app { display:flex; height:100%; }
  aside { width:320px; flex:none; overflow-y:auto; padding:20px; background:#1d2027; border-right:1px solid #353b46; }
  h1 { margin:0 0 4px; font-size:22px; }
  .hint { color:#aab2bf; font-size:12px; margin:0 0 18px; }
  label { display:block; margin:13px 0 5px; color:#bac2ce; font-size:12px; }
  select,input { width:100%; min-height:38px; padding:8px 10px; border:1px solid #414957; border-radius:7px; background:#12141a; color:#f0f2f5; font:inherit; }
  input:focus,select:focus,button:focus-visible { outline:2px solid #4cc2ff; outline-offset:1px; }
  .folder { display:flex; gap:6px; }
  .folder input { min-width:0; flex:1; }
  button { border:0; border-radius:7px; padding:9px 12px; cursor:pointer; font:inherit; }
  #browse { background:#303845; color:#fff; white-space:nowrap; }
  #export { width:100%; margin-top:20px; padding:12px; background:#4cc2ff; color:#082231; font-weight:700; }
  #export:disabled { opacity:.55; cursor:default; }
  #size,#status,#result { margin-top:10px; color:#aab2bf; font-size:12px; overflow-wrap:anywhere; }
  #status.error { color:#ff8080; }
  #result { color:#75dfa1; }
  #result a { color:#4cc2ff; }
  #mapwrap { flex:1; min-width:0; position:relative; overflow:hidden; }
  #map { height:100%; width:100%; }
  #target { position:absolute; z-index:600; pointer-events:none; border:4px solid #ff3b30; box-shadow:0 0 0 9999px rgba(0,0,0,.48); }
  #target span { position:absolute; top:-26px; left:-4px; padding:3px 7px; background:#ff3b30; color:white; font-size:11px; font-weight:700; white-space:nowrap; }
  @media(max-width:700px) { #app { flex-direction:column; } aside { width:100%; max-height:45vh; } #mapwrap { min-height:55vh; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>MapSnap</h1>
    <p class="hint">Export one clean map image from inside the red frame.</p>
    <label for="aspect">Aspect ratio</label>
    <select id="aspect">
      <option>16:9</option><option>9:16</option><option>1:1</option>
      <option>4:3</option><option>3:4</option><option>3:2</option>
      <option>2:3</option><option>4:5</option><option>5:4</option>
    </select>
    <label for="resolution">Resolution</label>
    <select id="resolution">
      <option value="4k">4K · 3840 px long edge</option>
      <option value="fhd">Full HD · 1920 px</option>
      <option value="hd">HD · 1280 px</option>
      <option value="750">750 px</option>
    </select>
    <div id="size"></div>
    <label for="source">Map source</label>
    <select id="source">
      <option value="esri_world_imagery">Esri World Imagery</option>
      <option value="google_satellite">Google Satellite</option>
      <option id="simpleoption" value="google_simple_map" disabled>Ivory Teal Map · API key required</option>
    </select>
    <label for="name">Image name</label>
    <input id="name" type="text" value="map" maxlength="100" autocomplete="off">
    <label for="folder">Output folder</label>
    <div class="folder"><input id="folder" type="text" spellcheck="false"><button id="browse" type="button">Choose…</button></div>
    <button id="export" type="button">Export image</button>
    <div id="status" role="status"></div>
    <div id="result"></div>
  </aside>
  <div id="mapwrap"><div id="map"></div><div id="target"><span>EXPORT TARGET</span></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ASPECTS = {"16:9":[16,9],"9:16":[9,16],"1:1":[1,1],"4:3":[4,3],"3:4":[3,4],"3:2":[3,2],"2:3":[2,3],"4:5":[4,5],"5:4":[5,4]};
const EDGES = {"4k":3840,"fhd":1920,"hd":1280,"750":750};
const R = 6378137;
const rad = value => value * Math.PI / 180;
function llToMerc(lng,lat) {
  const capped = Math.max(-85.05112878,Math.min(85.05112878,lat));
  return [R * rad(lng), R * Math.log(Math.tan(Math.PI/4 + rad(capped)/2))];
}
function dimensions() {
  const [x,y] = ASPECTS[$("aspect").value], edge = EDGES[$("resolution").value];
  return x >= y ? [edge,Math.round(edge*y/x)] : [Math.round(edge*x/y),edge];
}
const layers = {
  esri_world_imagery: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Esri, Maxar"}),
  google_satellite: L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {subdomains:["0","1","2","3"],maxZoom:20,attribution:"Imagery © Google"}),
  google_simple_map: L.tileLayer("/api/map-tiles/google-simple/{z}/{x}/{y}", {maxZoom:22,attribution:"Map data © Google"}),
};
const map = L.map("map", {zoomControl:true,zoomDelta:.25,zoomSnap:.05,wheelPxPerZoomLevel:120}).setView([24,45],6);
layers.esri_world_imagery.addTo(map);
let frame = null;
function updateFrame() {
  const [widthPx,heightPx] = dimensions(), size = map.getSize();
  $("size").textContent = `Output: ${widthPx} × ${heightPx} PNG`;
  if (!size.x || !size.y) return;
  const pad = 48, ratio = widthPx/heightPx;
  const availableW = Math.max(1,size.x-pad*2), availableH = Math.max(1,size.y-pad*2);
  let width,height;
  if (availableW/availableH > ratio) { height=availableH; width=height*ratio; }
  else { width=availableW; height=width/ratio; }
  const x=(size.x-width)/2, y=(size.y-height)/2;
  frame={x,y,width,height};
  const target=$("target");
  target.style.left=`${x-4}px`; target.style.top=`${y-4}px`;
  target.style.width=`${width+8}px`; target.style.height=`${height+8}px`;
}
map.on("resize",updateFrame);
$("aspect").addEventListener("change",updateFrame);
$("resolution").addEventListener("change",updateFrame);
$("source").addEventListener("change",() => {
  Object.values(layers).forEach(layer => map.removeLayer(layer));
  layers[$("source").value].addTo(map);
});
$("browse").addEventListener("click",async () => {
  try {
    const response=await fetch("/api/mapsnap/select-folder",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const data=await response.json();
    if (!response.ok || data.error) throw new Error(data.error || "Folder picker failed");
    if (data.path) $("folder").value=data.path;
  } catch(error) { $("status").textContent=error.message; $("status").className="error"; }
});
async function poll(jobId) {
  for (;;) {
    const response=await fetch(`/api/export/status/${jobId}`), data=await response.json();
    if (!response.ok || data.error) throw new Error(data.error || "Export status unavailable");
    const state=data.status || {};
    $("status").textContent=state.message || state.stage || "Exporting…";
    if (state.stage === "done") return data.result;
    if (state.stage === "error") throw new Error(state.message || "Export failed");
    await new Promise(resolve => setTimeout(resolve,800));
  }
}
$("export").addEventListener("click",async () => {
  if (!frame) return;
  const button=$("export"); button.disabled=true;
  $("status").className=""; $("status").textContent="Starting export…";
  $("result").textContent="";
  try {
    const tl=map.containerPointToLatLng([frame.x,frame.y]);
    const br=map.containerPointToLatLng([frame.x+frame.width,frame.y+frame.height]);
    const [minx,maxy]=llToMerc(tl.lng,tl.lat), [maxx,miny]=llToMerc(br.lng,br.lat);
    const body={name:$("name").value,output_folder:$("folder").value,
      aspect:$("aspect").value,resolution:$("resolution").value,source:$("source").value,
      bbox_mercator:{minx,miny,maxx,maxy}};
    const response=await fetch("/api/mapsnap/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await response.json();
    if (!response.ok || data.error) throw new Error(data.error || "Export failed to start");
    const result=await poll(data.job_id);
    $("result").textContent=`Saved ${result.width} × ${result.height} PNG: ${result.path}`;
  } catch(error) { $("status").textContent=error.message; $("status").className="error"; }
  finally { button.disabled=false; }
});
async function boot() {
  try {
    const response=await fetch("/api/mapsnap/settings"), data=await response.json();
    if (!response.ok || data.error) throw new Error(data.error || "Settings unavailable");
    $("folder").value=data.default_output_folder;
    const option=$("simpleoption");
    option.disabled=!data.google_maps_api_key_configured;
    option.textContent=data.google_maps_api_key_configured ? "Ivory Teal Map" : "Ivory Teal Map · API key required";
  } catch(error) { $("status").textContent=error.message; $("status").className="error"; }
  updateFrame();
}
boot();
</script>
</body>
</html>
